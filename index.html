<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HAHAHUB | Comedy Discovery</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Bungee&family=Space+Grotesk:wght@300;400;500;600;700&family=Bowlby+One+SC&family=Syne:wght@400;700;800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            yellow: '#FFDE03',
                            pink: '#FF0266',
                            cyan: '#03DAC6',
                            black: '#050505',
                            surface: '#121212',
                            border: '#2E2E2E'
                        }
                    },
                    fontFamily: {
                        sans: ['Space Grotesk', 'sans-serif'],
                        display: ['Bungee', 'cursive'],
                        funky: ['Bowlby One SC', 'cursive'],
                        syne: ['Syne', 'sans-serif'],
                    },
                    boxShadow: {
                        'neo-magenta': '4px 4px 0px 0px #FF0266',
                        'neo-cyan': '4px 4px 0px 0px #03DAC6',
                        'neo-yellow': '4px 4px 0px 0px #FFDE03',
                        'neo-white': '8px 8px 0px 0px #FFFFFF',
                    },
                    animation: {
                        'marquee': 'marquee 25s linear infinite',
                    },
                    keyframes: {
                        marquee: {
                            '0%': { transform: 'translateX(0%)' },
                            '100%': { transform: 'translateX(-100%)' },
                        }
                    }
                }
            }
        }
    </script>
    <style type="text/tailwindcss">
        @layer base {
            body {
                @apply bg-brand-black text-white selection:bg-brand-yellow selection:text-black;
                background-image: radial-gradient(#222 1px, transparent 1px);
                background-size: 30px 30px;
            }
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .logo-text {
            font-family: 'Bowlby One SC', cursive;
            text-shadow: 2px 2px 0px #FF0266, 4px 4px 0px #03DAC6;
        }
        .ticker-wrap {
            overflow: hidden;
            background: #FFDE03;
            color: black;
            font-weight: 900;
            text-transform: uppercase;
            padding: 4px 0;
            font-size: 10px;
            letter-spacing: 0.1em;
            border-bottom: 2px solid black;
        }
    </style>
</head>
<body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
</body>
</html>
