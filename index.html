<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HAHAHUB – The Global Theater Comedy Hub</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,400;0,700;0,900;1,400;1,700;1,900&family=Space+Mono:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      :root {
        --black: #0a0a0a;
        --white: #f5f5f0;
        --yellow: #FFD600;
        --pink: #FF0266;
        --cyan: #00E5FF;
        --surface: #161616;
      }
      body { background: var(--black); color: var(--white); font-family: 'Space Mono', monospace; }
      .font-display { font-family: 'Barlow Condensed', sans-serif; }
      .logo-text { font-family: 'Barlow Condensed', sans-serif; font-weight: 900; font-style: italic; color: var(--yellow); letter-spacing: -0.02em; }
      .shadow-neo-pink { box-shadow: 6px 6px 0px var(--pink); }
      .shadow-neo-cyan { box-shadow: 6px 6px 0px var(--cyan); }
      .shadow-neo-yellow { box-shadow: 6px 6px 0px var(--yellow); }
      .shadow-neo-white { box-shadow: 6px 6px 0px var(--white); }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
