    <script>
        // Show the page as soon as the text fonts are ready (never wait more than 1.5 s, never wait for icons).
        (function () {
            var shown = false;
            function show() { if (!shown) { shown = true; document.documentElement.classList.add('fonts-loaded'); } }
            setTimeout(show, 1500);
            if (document.fonts && document.fonts.load) {
                Promise.all([
                    document.fonts.load("400 1em 'Space Grotesk'"),
                    document.fonts.load("1em 'Bowlby One SC'"),
                    document.fonts.load("1em 'Bungee'")
                ]).then(show, show);
            } else {
                setTimeout(show, 300);
            }
        })();
    </script>
