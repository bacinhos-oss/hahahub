<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content">
    <title>HahaHub | International Theatre Comedy Producers Platform</title>

    <!-- SEO -->
    <meta name="description" content="The first producer-to-producer comedy rights marketplace. Buy rights, sell rights. Direct. No agents. No middlemen. International. Tickle. Set Up. Punch.">
    <meta name="keywords" content="comedy rights, theatre licensing, comedy marketplace, producer platform, international theatre, comedy licensing">
    <meta name="author" content="HahaHub">
    <meta name="robots" content="index, follow">
    <link rel="canonical" href="https://www.hahahub.art">

    <!-- Theme color — mobile browser bar -->
    <meta name="theme-color" content="#050505">
    <meta name="msapplication-TileColor" content="#FFDE03">

    <!-- Favicons -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="manifest" href="/site.webmanifest">

    <!-- Open Graph -->
    <meta property="og:title" content="HahaHub | International Theatre Comedy Producers Platform">
    <meta property="og:description" content="The first producer-to-producer comedy rights marketplace. Tickle. Set Up. Punch.">
    <meta property="og:url" content="https://www.hahahub.art">
    <meta property="og:type" content="website">
    <meta property="og:image" content="https://www.hahahub.art/og-image.jpg">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:site_name" content="HahaHub">
    <meta property="og:locale" content="en_US">

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="HahaHub | Comedy Rights Marketplace">
    <meta name="twitter:description" content="Tickle. Set Up. Punch. The first P2P comedy rights platform.">
    <meta name="twitter:image" content="https://www.hahahub.art/og-image.jpg">

    <!-- FONT PRELOAD — prevents FOUT on all devices -->
    <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Bowlby+One+SC&family=Bungee&family=Space+Grotesk:wght@400;600;700&display=block">
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@400,0&display=block">
    <link href="https://fonts.googleapis.com/css2?family=Bowlby+One+SC&family=Bungee&family=Space+Grotesk:wght@300;400;500;600;700&family=Syne:wght@400;700;800&display=block" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=block" rel="stylesheet">

    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            yellow: '#FFDE03',
                            pink:   '#FF0266',
                            cyan:   '#03DAC6',
                            black:  '#050505',
                            surface:'#121212',
                            border: '#2E2E2E',
                        }
                    },
                    fontFamily: {
                        sans:    ['Space Grotesk', 'sans-serif'],
                        display: ['Bungee', 'cursive'],
                        funky:   ['Bowlby One SC', 'cursive'],
                        syne:    ['Syne', 'sans-serif'],
                    },
                    boxShadow: {
                        'neo-magenta': '4px 4px 0px 0px #FF0266',
                        'neo-cyan':    '4px 4px 0px 0px #03DAC6',
                        'neo-yellow':  '4px 4px 0px 0px #FFDE03',
                        'neo-white':   '8px 8px 0px 0px #FFFFFF',
                    },
                    animation: {
                        'marquee': 'marquee 25s linear infinite',
                    },
                    keyframes: {
                        marquee: {
                            '0%':   { transform: 'translateX(0%)' },
                            '100%': { transform: 'translateX(-100%)' },
                        }
                    }
                }
            }
        }
    </script>
    <style type="text/tailwindcss">
        @layer base {
            html { visibility: hidden; }
            html.fonts-loaded { visibility: visible; }

            body {
                @apply bg-brand-black text-white selection:bg-brand-yellow selection:text-black;
                background-image: radial-gradient(#2E2E2E 1px, transparent 1px);
                background-size: 30px 30px;
                font-family: 'Space Grotesk', sans-serif;
            }

            *, *::before, *::after {
                -webkit-font-smoothing: antialiased;
                -moz-osx-font-smoothing: grayscale;
            }
        }

        .safe-bottom { padding-bottom: env(safe-area-inset-bottom, 0px); }
        .safe-top    { padding-top:    env(safe-area-inset-top, 0px); }

        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .logo-text {
            font-family: 'Bowlby One SC', cursive;
            text-shadow: 2px 2px 0px #FF0266, 4px 4px 0px #03DAC6;
            color: #FFFFFF;
        }
        .ticker-wrap {
            overflow: hidden;
            background: #FFDE03;
            color: #050505;
            font-weight: 900;
            text-transform: uppercase;
            padding: 4px 0;
            font-size: 10px;
            letter-spacing: 0.1em;
            border-bottom: 2px solid #050505;
        }
    </style>
    <script>
        if (document.fonts && document.fonts.ready) {
            document.fonts.ready.then(() => {
                document.documentElement.classList.add('fonts-loaded');
            });
        } else {
            setTimeout(() => document.documentElement.classList.add('fonts-loaded'), 300);
        }
    </script>
</head>
    <!-- Google Analytics — disabled until cookie consent -->
    <script>
      window['ga-disable-G-SEPT0657QY'] = true;
      if (localStorage.getItem('hahahub_cookies') === 'accepted') {
        window['ga-disable-G-SEPT0657QY'] = false;
      }
    </script>
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-SEPT0657QY"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-SEPT0657QY', { anonymize_ip: true });
    </script>
<body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
</body>
</html>
