    <!-- SEO -->
    <meta name="description" content="HahaHub is the international professional network for theatre comedy producers. Showcase productions, discover new titles, connect directly with fellow producers, and create new licensing opportunities. Tickle. Set Up. Punch.">

    <!-- Open Graph -->

    <!-- FONT PRELOAD — prevents FOUT on all devices -->
    <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Bowlby+One+SC&family=Bungee&family=Space+Grotesk:wght@400;600;700&display=block">
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@400,0&display=block">

    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=block" rel="stylesheet">



    <script>
        if (document.fonts && document.fonts.ready) {
            document.fonts.ready.then(() => {
                document.documentElement.classList.add('fonts-loaded');
            });
        } else {
            setTimeout(() => document.documentElement.classList.add('fonts-loaded'), 300);
        }
    </script>

    <!-- Structured Data — Google Rich Results -->
    <script type="application/ld+json">

        "query-input": "required name=search_term_string"
